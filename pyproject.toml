[project]
name = "cccfm"
version = "0.0.1"
description = "Context-Conditioned Conditional Flow Matching for Cross-Cell-Line Perturbation Prediction"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anonymous"}]
dependencies = [
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "torchcfm==1.0.7",
    "torchdiffeq>=0.2",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scikit-learn>=1.3",
    "pot>=0.9",
    "scipy>=1.11",
    "numpy>=1.24",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ipython", "jupyter"]
logging = ["wandb", "tensorboard"]
config = ["hydra-core"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["code"]
include = ["cccfm*"]
