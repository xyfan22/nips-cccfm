# Conda environment for the ccCFM artifact reviewer smoke-test.
# Pinned to versions known to reproduce the shipped CSV / MD source-of-truth.
# CPU-only; no GPU is required for any documented smoke-test step.
name: cccfm-review
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy=1.26
  - scipy=1.11
  - pandas=2.1
  - scikit-learn=1.3
  - matplotlib=3.8
  - anndata=0.10
  - scanpy=1.10
  - pyyaml
  - pytest
  - pip
  - pip:
      - pot==0.9.4                       # Sinkhorn-W2 in cccfm.eval_metrics
      - torch==2.2.2 ; sys_platform != 'darwin' or platform_machine != 'arm64'
      - torchdiffeq==0.2.4               # ODE integration for residual-flow probe
      - torchcfm==1.0.7                  # conditional flow matching
      - pytorch-lightning==2.2.0
      - -e ./code                        # install the cccfm package in editable mode
